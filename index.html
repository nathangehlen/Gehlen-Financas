<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Caixa financeiro da Gehlen's Club">
<meta name="theme-color" content="#0c0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Financeiro — Gehlen's</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<style>
  /* Layout: preto como cor principal (barra superior e menu inferior sempre pretos), vermelho escuro da marca como acento, branco. Fundo escuro em carvão com brilho sutil pra não ficar chapado. */
  :root{
    --bg:#f0eff2; --surface:#ffffff; --surface2:#f4f3f7; --surface3:#eae8ef; --fg:#18171b; --muted:#716f7a; --faint:#9c9aa6;
    --line:#e6e4ec; --accent:#c41e2a; --accent-ink:#981320; --accent-soft:rgba(196,30,42,.10); --on-accent:#ffffff;
    --accent-45:rgba(196,30,42,.45); --accent-65:rgba(196,30,42,.65);
    --chrome:#ffffff; --on-chrome:#18171b; --chrome-dim:rgba(24,23,27,.5); --chrome-line:#e6e4ec; --chrome-btn:#f1f0f4; --chrome-btnln:#e3e1e9;
    --glow:none;
    --pj:#c41e2a; --pf:#575563; --good:#1f9d57; --lucro:#1f9d57; --warn:#b9800f; --bad:#c41e2a;
    --shadow:0 1px 2px rgba(18,16,22,.05),0 10px 26px rgba(18,16,22,.07);
    --r:16px; --f-disp:"Oswald","Arial Narrow",system-ui,sans-serif;
    --f-serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0a0809; --surface:#18141a; --surface2:#201b22; --surface3:#2a232c; --fg:#f5f3f6; --muted:#9a949e; --faint:#6b656f;
    --line:#2a242d; --accent:#df2531; --accent-ink:#9c1620; --accent-soft:rgba(223,37,49,.16); --on-accent:#ffffff;
    --accent-45:rgba(223,37,49,.45); --accent-65:rgba(223,37,49,.60);
    --chrome:#0b080a; --on-chrome:#f5f3f6; --chrome-dim:rgba(255,255,255,.5); --chrome-line:rgba(255,255,255,.06); --chrome-btn:rgba(255,255,255,.06); --chrome-btnln:rgba(255,255,255,.12);
    --glow:radial-gradient(1000px 540px at 50% -12%, rgba(223,37,49,.20), transparent 62%);
    --pj:#e5414c; --pf:#acaab6; --good:#37c47e; --lucro:#37c47e; --warn:#e2b55e; --bad:#e5414c;
    --shadow:0 1px 2px rgba(0,0,0,.55),0 16px 36px rgba(0,0,0,.5); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0a0809; --surface:#18141a; --surface2:#201b22; --surface3:#2a232c; --fg:#f5f3f6; --muted:#9a949e; --faint:#6b656f;
    --line:#2a242d; --accent:#df2531; --accent-ink:#9c1620; --accent-soft:rgba(223,37,49,.16); --on-accent:#ffffff;
    --accent-45:rgba(223,37,49,.45); --accent-65:rgba(223,37,49,.60);
    --chrome:#0b080a; --on-chrome:#f5f3f6; --chrome-dim:rgba(255,255,255,.5); --chrome-line:rgba(255,255,255,.06); --chrome-btn:rgba(255,255,255,.06); --chrome-btnln:rgba(255,255,255,.12);
    --glow:radial-gradient(1000px 540px at 50% -12%, rgba(223,37,49,.20), transparent 62%);
    --pj:#e5414c; --pf:#acaab6; --good:#37c47e; --lucro:#37c47e; --warn:#e2b55e; --bad:#e5414c;
    --shadow:0 1px 2px rgba(0,0,0,.55),0 16px 36px rgba(0,0,0,.5); color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{background:var(--bg);background-image:var(--glow);background-attachment:fixed;background-repeat:no-repeat;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums} h1{margin:0}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:16px}
  summary{list-style:none} summary::-webkit-details-marker{display:none}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chrome);color:var(--on-chrome);border-bottom:1px solid var(--chrome-line)}
  .hwrap{max-width:560px;margin:0 auto;padding:11px 13px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;flex:none}
  .mark{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(145deg,var(--accent),var(--accent-ink));display:grid;place-items:center;color:#fff;font-family:var(--f-disp);font-weight:700;font-size:16px;box-shadow:0 2px 8px var(--accent-65)}
  .brand h1{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;color:var(--on-chrome)}
  .hbtns{display:flex;gap:6px;flex:none}
  .ibtn{position:relative;background:var(--chrome-btn);border:1px solid var(--chrome-btnln);color:var(--on-chrome);border-radius:9px;height:36px;min-width:34px;padding:0 7px;display:grid;place-items:center;font-size:14px;font-weight:600}
  .ibtn:active{background:var(--accent-65)}
  .monthrow{max-width:560px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;justify-content:center;gap:14px}
  .monthrow button{width:36px;height:30px;border:1px solid var(--chrome-btnln);border-radius:8px;background:var(--chrome-btn);color:var(--on-chrome);font-size:17px;line-height:1}
  #mesLabel{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.06em;font-size:13px;min-width:160px;text-align:center;color:var(--on-chrome)}
  main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
  .view{display:flex;flex-direction:column;gap:14px}
  .view[hidden]{display:none!important}
  .label{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.13em;font-size:11.5px;font-weight:600;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card.pad{padding:16px}
  .pos{color:var(--good)} .neg{color:var(--bad)} .muted{color:var(--muted)} .lucrotxt{color:var(--lucro)}
  .saldocard{padding:16px 18px;position:relative;overflow:hidden}
  .saldocard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:0 3px 3px 0}
  .saldocard.pj::before{background:var(--pj)} .saldocard.pf::before{background:var(--pf)}
  .saldocard .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .saldocard .big{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1.02;margin-top:6px;letter-spacing:.01em}
  .saldocard .prev{font-size:12.5px;margin-top:7px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.pj{background:var(--pj)}.dot.pf{background:var(--pf)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:13px 14px}.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-family:var(--f-disp);font-weight:600;font-size:20px;margin-top:3px}
  .metacard{padding:16px}
  .metatop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:4px}
  .metapct{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em}
  .metabar{height:14px;border-radius:999px;background:var(--surface3);overflow:hidden;margin-top:11px;display:flex}
  .metabar>.fill{height:100%;background:linear-gradient(90deg,var(--accent-ink),var(--accent));transition:width .5s cubic-bezier(.4,0,.2,1)}
  .metabar>.fill.full{background:linear-gradient(90deg,color-mix(in srgb,var(--good) 78%,#000),var(--good))}
  .metabar>.over{height:100%;background:repeating-linear-gradient(45deg,var(--lucro),var(--lucro) 6px,color-mix(in srgb,var(--lucro) 70%,#000) 6px,color-mix(in srgb,var(--lucro) 70%,#000) 12px);transition:width .4s}
  .metafoot{font-size:12.5px;margin-top:9px;color:var(--muted)}
  .fatsum{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .fatsum .v{font-family:var(--f-disp);font-weight:600;font-size:20px}
  .caret{color:var(--muted);transition:transform .2s} details[open] .caret{transform:rotate(90deg)}
  .rowitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--line)}
  .rowitem:first-child{border-top:0}
  .rowitem .ic{width:33px;height:33px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px;background:var(--surface2);color:var(--muted)}
  .rowitem .mid{flex:1;min-width:0}
  .rowitem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowitem .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowitem .val{font-family:var(--f-disp);font-weight:600;white-space:nowrap}
  .tagcls{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;text-transform:uppercase}
  .tagcls.PJ{color:var(--pj);background:color-mix(in srgb,var(--pj) 16%,transparent)}
  .tagcls.PF{color:var(--pf);background:color-mix(in srgb,var(--pf) 16%,transparent)}
  .estimtag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}
  .pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
  .pill.pendente{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
  .pill.pago{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
  .pill.atrasado{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
  .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface2);flex:none;display:grid;place-items:center;color:transparent;font-weight:900;font-size:15px;transition:.12s}
  .chk.on{background:var(--good);border-color:var(--good);color:#fff}
  .bar{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden;margin-top:7px}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--pf);transition:width .4s}
  .bar.ov>i{background:var(--bad)}.bar.near>i{background:var(--warn)}.bar.good>i{background:var(--lucro)}.bar.pj>i{background:var(--pj)}
  .catrow{display:flex;flex-direction:column;gap:6px}
  .catrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .steppers{display:flex;align-items:center;gap:8px;margin-top:4px}
  .step{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:18px;font-weight:700;display:grid;place-items:center;line-height:1}
  .step:active{background:var(--accent);color:var(--on-accent)}
  .tetoinp{width:92px;text-align:center;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
  .steplab{font-size:11px;color:var(--muted);flex:1;text-align:right}
  .field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:600}
  .inp{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--fg)}
  .inp:focus{outline:2px solid var(--accent);outline-offset:1px}
  .edinp{width:120px;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
  .miniedit{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);flex:none;font-size:13px}
  .addbtn{border:1px dashed var(--accent);background:transparent;color:var(--accent-ink);border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px}
  .pfi{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--fg);font-size:14px}
  .pfsave{flex:1;padding:10px;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:600}
  .pfghost{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--muted);font-weight:600}
  .pfdanger{padding:10px 13px;border:1px solid #d9534f;border-radius:9px;background:transparent;color:#d9534f;font-weight:600}
  .extbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--fg);padding:15px 16px;font-weight:600;font-size:15px}
  .extbtn span{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
  .extbtn:active{border-color:var(--accent)}
  .extcard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .extcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .extcard .ei{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:21px;background:var(--accent-soft)}
  .extcard .et{flex:1;min-width:0}
  .extcard .et .t{font-weight:700;font-size:15.5px;color:var(--fg);letter-spacing:.01em}
  .extcard .et .s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .extcard .ec{font-size:20px;color:var(--accent);font-weight:700;flex:none}
  .extcard:active{transform:scale(.992)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--muted);font-weight:700}
  .seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .seg.cls button.pjsel[aria-pressed="true"]{background:var(--pj);border-color:var(--pj);color:#fff}
  .seg.cls button.pfsel[aria-pressed="true"]{background:var(--pf);border-color:var(--pf);color:#fff}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:var(--on-accent);font-family:var(--f-disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:15px;box-shadow:0 6px 20px var(--accent-45)}
  .btn:active{filter:brightness(.94)} .btn:disabled{opacity:.5}
  .guess{border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .guess .g1{font-size:12px;color:var(--muted)} .guess b{color:var(--accent-ink)}
  .empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}.empty .em{font-size:28px;margin-bottom:8px;opacity:.6}
  .banner{padding:11px 14px;border-radius:11px;background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:13px}
  .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
  .editrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--chrome);border-top:1px solid var(--chrome-line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .nwrap{max-width:560px;margin:0 auto;display:flex}
  nav button{position:relative;flex:1;background:none;border:0;padding:11px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--chrome-dim);font-size:10.5px;font-weight:600;letter-spacing:.02em}
  nav button .ni{font-size:19px;line-height:1}
  nav button[aria-current="true"]{color:var(--accent)}
  nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
  .toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:var(--shadow);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  #gate{position:fixed;inset:0;z-index:100;background:var(--bg);background-image:var(--glow);background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;padding:24px}
  #gate[hidden]{display:none!important}
  .gatebox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 24px 22px;box-shadow:var(--shadow)}
  .gatelogo{font-family:var(--f-serif);font-weight:700;font-size:35px;line-height:1;color:var(--fg);letter-spacing:.01em}
  .gateclub{font-family:var(--f-disp);font-weight:600;letter-spacing:.42em;font-size:10px;color:var(--muted);margin:6px 0 0;padding-left:.42em}
  .gatesub{margin:8px 0 14px;color:var(--muted);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
  .gatebox .inp{text-align:left;font-size:16px;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:13px 14px}
  .gatebox .inp::placeholder{color:var(--faint)}
  .gateerr{color:var(--bad);font-size:12.5px;min-height:16px;text-align:left}
  .gatever{margin-top:14px;font-size:11px;color:var(--muted);opacity:.7;letter-spacing:.02em}
  .gatever a.gatereset{color:var(--muted);text-decoration:underline;cursor:pointer}
</style>

</head>
<body>
<div id="gate">
  <div class="gatebox">
    <div class="gatelogo">Gehlen's</div>
    <div class="gateclub">CLUB</div>
    <p class="gatesub">Financeiro · Acesso restrito</p>
    <input id="lg-email" class="inp" type="email" inputmode="email" autocomplete="username" placeholder="E-mail">
    <input id="lg-pass" class="inp" type="password" autocomplete="current-password" placeholder="Senha">
    <div id="lg-err" class="gateerr"></div>
    <button id="lg-btn" class="btn">Entrar</button>
    <div class="gatever">versão v42 · <a href="?reset=1" class="gatereset">limpar cache</a></div>
  </div>
</div>

<header>
  <div class="hwrap">
    <div class="brand"><div class="mark">G</div><h1>Financeiro</h1></div>
    <div class="hbtns">
      <button class="ibtn" id="lancBtn" title="Lançar">＋</button>
      <button class="ibtn" id="extBtn" title="Enviar extratos">🧾</button>
      <button class="ibtn" id="triBtn" title="Triagem">✎<span class="badge" id="triBadge" hidden>0</span></button>
      <button class="ibtn" id="reloadBtn" title="Recarregar dados">↻</button>
      <button class="ibtn" id="themeBtn" title="Tema">◐</button>
    </div>
  </div>
  <div class="monthrow"><button id="mprev" aria-label="Mês anterior">‹</button><div id="mesLabel" class="num">—</div><button id="mnext" aria-label="Próximo mês">›</button></div>
</header>

<main>
  <section class="view" id="v-painel"></section>
  <section class="view" id="v-pessoal" hidden></section>
  <section class="view" id="v-contas" hidden></section>
  <section class="view" id="v-lucro" hidden></section>
  <section class="view" id="v-metas" hidden></section>
  <section class="view" id="v-lancar" hidden></section>
  <section class="view" id="v-triagem" hidden></section>
  <section class="view" id="v-extratos" hidden></section>
</main>
<input type="file" id="extFile" accept="application/pdf,image/*" hidden>

<nav><div class="nwrap">
  <button data-view="painel" aria-current="true"><span class="ni">▦</span>Painel</button>
  <button data-view="pessoal"><span class="ni">◉</span>Pessoal</button>

  function paintDraft(){if(!draft)return;var box=el("f-result");if(!box)return;var known=!!draft.categoria;
    box.innerHTML='<div class="guess" style="margin-bottom:12px"><div class="g1">'+(known?'Identifiquei como <b>'+catLabel(draft.categoria)+'</b> ('+(draft.classe==="PJ"?"Barbearia":"Pessoal")+'). Confere ou ajuste:':'Não reconheci — escolha abaixo:')+'</div></div>'+
      '<div class="field" style="margin-bottom:10px"><label>Tipo</label><div class="seg" id="d-tipo"><button type="button" data-t="saida" aria-pressed="'+(draft.tipo==="saida")+'">Saída</button><button type="button" data-t="entrada" aria-pressed="'+(draft.tipo==="entrada")+'">Entrada</button></div></div>'+
      '<div class="field" style="margin-bottom:10px"><label>Barbearia ou pessoal?</label><div class="seg cls" id="d-cls"><button type="button" class="pjsel" data-c="PJ" aria-pressed="'+(draft.classe==="PJ")+'">Barbearia</button><button type="button" class="pfsel" data-c="PF" aria-pressed="'+(draft.classe==="PF")+'">Pessoal</button></div></div>'+
      '<div class="field" style="margin-bottom:14px"><label>Categoria</label><select class="inp" id="d-cat"><option value="">Escolher…</option>'+opts(draft.categoria)+'</select></div><button class="btn" id="d-save">Salvar lançamento</button>';
    box.querySelectorAll("#d-tipo button").forEach(function(b){b.addEventListener("click",function(){draft.tipo=b.getAttribute("data-t");setP("d-tipo",b);});});
    box.querySelectorAll("#d-cls button").forEach(function(b){b.addEventListener("click",function(){draft.classe=b.getAttribute("data-c");setP("d-cls",b);if(draft.categoria&&CATMAP[draft.categoria]&&CATMAP[draft.categoria].classe!==draft.classe){draft.categoria=null;el("d-cat").value="";}});});
    el("d-cat").addEventListener("change",function(){draft.categoria=this.value||null;if(draft.categoria){var c=CATMAP[draft.categoria];draft.classe=c.classe;if(c.tipo)draft.tipo=c.tipo;setPV("d-cls",c.classe,"data-c");setPV("d-tipo",draft.tipo,"data-t");}});
    el("d-save").addEventListener("click",salvarLanc);}
  function setP(g,btn){el(g).querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b===btn);});}
  function setPV(g,v,a){el(g).querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute(a)===v);});}
  function salvarLanc(){if(!draft)return;if(!S.db){toast("Sem conexão");return;}var btn=el("d-save");btn.disabled=true;btn.textContent="Salvando…";var revisar=!draft.categoria||!draft.classe;
    S.db.collection("lancamentos").add({desc:draft.desc,valor:draft.valor,tipo:draft.tipo||"saida",classe:draft.classe||null,categoria:draft.categoria||null,status:revisar?"revisar":"ok",mes:S.mesSel,ts:Date.now()}).then(function(){draft=null;toast(revisar?"Salvo — foi pra Triagem":"Lançado ✓");reloadLanc();renderLancar();}).catch(function(){btn.disabled=false;btn.textContent="Salvar lançamento";toast("Não deu pra salvar");});}

  function novaCatBlock(){return triNewCat
    ? '<div class="card pad" style="display:flex;flex-direction:column;gap:9px"><div class="label" style="margin:0">Nova categoria</div><input class="pfi" id="nc-name" placeholder="Nome (ex: Taxa da maquininha)"><div class="seg" id="nc-cls"><button type="button" data-c="PJ" aria-pressed="true">Barbearia</button><button type="button" data-c="PF" aria-pressed="false">Pessoal</button></div><div style="display:flex;gap:7px"><button class="pfsave" id="nc-save">Criar</button><button class="pfghost" id="nc-cancel">Cancelar</button></div></div>'
    : '<div style="display:flex;justify-content:flex-end;margin:2px 0"><button class="addbtn" id="nc-open">＋ Nova categoria</button></div>';}
  function wireNovaCat(){var o=el("nc-open");if(o)o.onclick=function(){triNewCat=true;renderTriagem();};
    var c=el("nc-cancel");if(c)c.onclick=function(){triNewCat=false;renderTriagem();};
    var s=el("nc-save");if(s)s.onclick=function(){var nm=el("nc-name").value,cl="PJ",box=el("nc-cls");if(box)box.querySelectorAll("button").forEach(function(b){if(b.getAttribute("aria-pressed")==="true")cl=b.getAttribute("data-c");});if(!(nm||"").trim()){toast("Dê um nome à categoria");return;}criarCategoria(nm,cl);triNewCat=false;};
    var cls=el("nc-cls");if(cls)cls.querySelectorAll("button").forEach(function(b){b.onclick=function(){cls.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b);});};});}
  function renderTriagem(){
    var host=el("v-triagem");if(!S.ready){host.innerHTML=loadingCard();return;}
    var list=triagemList().slice().sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    if(!list.length){host.innerHTML=dbBanner()+'<div class="card pad empty"><div class="em">✓</div>Triagem vazia. Tudo categorizado!</div>'+novaCatBlock();wireNovaCat();return;}
    var h=dbBanner()+'<div class="label" style="margin:2px 2px 0">Triagem — defina PF/PJ e a categoria</div>'+novaCatBlock();
    list.forEach(function(l){var ed=triEditId===l.id;
      h+='<div class="card pad" style="display:flex;flex-direction:column;gap:10px" data-rev="'+l.id+'"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0;flex:1">'+
        (ed?'<input class="pfi" data-f="edesc" value="'+esc(l.desc)+'" placeholder="Descrição">':'<b>'+esc(l.desc)+'</b>')+
        '<div class="s muted" style="font-size:12px;margin-top:3px">'+(dataLanc(l)?dataLanc(l)+" · ":"")+(l.tipo==="entrada"?"entrada":"saída")+'</div></div>'+
        (ed?'<input class="pfi" data-f="eval" type="number" inputmode="decimal" value="'+(+l.valor||0)+'" style="width:108px;text-align:right">':'<span class="val num">'+money(l.valor)+'</span>')+'</div>'+
        '<div class="seg cls" data-f="cls"><button type="button" class="pjsel" data-c="PJ" aria-pressed="'+(l.classe==="PJ")+'">Barbearia</button><button type="button" class="pfsel" data-c="PF" aria-pressed="'+(l.classe==="PF")+'">Pessoal</button></div>'+
        '<select class="inp" data-f="cat"><option value="">Categoria…</option>'+opts(l.categoria)+'</select>'+
        '<div style="display:flex;gap:7px"><button class="btn" data-f="ok" style="flex:1">Confirmar</button><button class="pfghost" data-f="edit" title="Editar nome/valor">'+(ed?'↩':'✎')+'</button></div></div>';});
    host.innerHTML=h;
    wireNovaCat();
    host.querySelectorAll("[data-rev]").forEach(function(card){var id=card.getAttribute("data-rev"),sel={classe:null};
      card.querySelectorAll('[data-f="cls"] button').forEach(function(b){if(b.getAttribute("aria-pressed")==="true")sel.classe=b.getAttribute("data-c");b.addEventListener("click",function(){sel.classe=b.getAttribute("data-c");card.querySelectorAll('[data-f="cls"] button').forEach(function(x){x.setAttribute("aria-pressed",x===b);});});});
      var catSel=card.querySelector('[data-f="cat"]');catSel.addEventListener("change",function(){if(this.value&&CATMAP[this.value]){var c=CATMAP[this.value];sel.classe=c.classe;card.querySelectorAll('[data-f="cls"] button').forEach(function(x){x.setAttribute("aria-pressed",x.getAttribute("data-c")===c.classe);});}});
      card.querySelector('[data-f="edit"]').addEventListener("click",function(){triEditId=(triEditId===id?null:id);renderTriagem();});
      card.querySelector('[data-f="ok"]').addEventListener("click",function(){var cat=catSel.value||null,classe=sel.classe||(cat&&CATMAP[cat]?CATMAP[cat].classe:null);if(!cat){toast("Escolha a categoria");return;}if(!classe)classe="PJ";var btn=card.querySelector('[data-f="ok"]');btn.disabled=true;btn.textContent="Salvando…";var up={classe:classe,categoria:cat,status:"ok"};var c=CATMAP[cat];if(c&&c.tipo)up.tipo=c.tipo;
        var ei=card.querySelector('[data-f="edesc"]'),ev=card.querySelector('[data-f="eval"]');if(ei)up.desc=(ei.value||"").trim();if(ev){var nv=parseFloat(ev.value);if(!isNaN(nv))up.valor=nv;}
        S.db.doc("lancamentos/"+id).update(up).then(function(){triEditId=null;var nd=up.desc||((S.lanc.filter(function(x){return x.id===id;})[0]||{}).desc);if(cat!=="transferencia")saveRegra(nd,cat,classe);toast(cat==="transferencia"?"Marcado como transferência ✓":"Categorizado ✓ — vou lembrar");reloadLanc();}).catch(function(){btn.disabled=false;btn.textContent="Confirmar";toast("Erro");});});
    });
  }

  // ---- DB load (get-based, robusto) ----
  function reloadContas(tries){tries=tries||0;if(!S.db)return;
    S.db.collection("contas").limit(1000).get().then(function(q){
      S.contas=q.docs.map(fromSnap);S.loaded=true;S.loadErr=null;render();
      if(S.contas.length===0&&tries<4){setTimeout(function(){reloadContas(tries+1);},1300);}
    }).catch(function(e){S.loadErr=(e&&(e.code||e.message))||"erro";S.loaded=true;render();if(tries<4){setTimeout(function(){reloadContas(tries+1);},1600);}});}
  function reloadLanc(tries){tries=tries||0;if(!S.db)return;
    S.db.collection("lancamentos").limit(1000).get().then(function(q){S.lanc=q.docs.map(fromSnap);render();autoAplicarRegras();})
    .catch(function(e){if(tries<4){setTimeout(function(){reloadLanc(tries+1);},1600);}});}
  function reloadInbox(tries){tries=tries||0;if(!S.db)return;
    S.db.collection("inbox").limit(500).get().then(function(q){S.inbox=q.docs.map(fromSnap);render();})
    .catch(function(e){if(tries<3){setTimeout(function(){reloadInbox(tries+1);},1600);}});}
  function reloadRegras(tries){tries=tries||0;if(!S.db)return;
    S.db.collection("regras").limit(1000).get().then(function(q){S.regras=q.docs.map(fromSnap);autoAplicarRegras();})
    .catch(function(e){if(tries<3){setTimeout(function(){reloadRegras(tries+1);},1600);}});}
  // ---- MEMÓRIA DE CATEGORIAS (regras aprendidas) ----
  function normKey(s){return String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\d+/g," ").replace(/[^A-Z ]+/g," ").replace(/\s+/g," ").trim();}
  function matchRegra(desc){var nk=normKey(desc);if(!nk)return null;
    for(var i=0;i<S.regras.length;i++){var r=S.regras[i];var rk=r.chave||normKey(r.exemplo||"");if(!rk)continue;
      if(nk===rk||(rk.length>=4&&(nk.indexOf(rk)>=0||rk.indexOf(nk)>=0)))return r;}
    return null;}
  function saveRegra(desc,categoria,classe){if(!S.db||!categoria)return;var chave=normKey(desc);if(!chave)return;
    var id=chave.replace(/ /g,"_").replace(/[^A-Z_]/g,"").slice(0,90);if(!id)return;
    S.db.doc("regras/"+id).set({chave:chave,categoria:categoria,classe:classe||null,exemplo:desc,ts:Date.now()}).then(reloadRegras).catch(function(){});}
  var autoBusy=false;
  function autoAplicarRegras(){if(autoBusy||!S.db||!S.regras.length||!S.lanc.length)return;
    var todo=[];S.lanc.forEach(function(l){if(l.status!=="revisar")return;var r=matchRegra(l.desc);if(r&&r.categoria)todo.push({id:l.id,cat:r.categoria,classe:r.classe});});
    if(!todo.length)return;autoBusy=true;var done=0;
    todo.forEach(function(t){var up={categoria:t.cat,classe:t.classe,status:"ok"};var c=CATMAP[t.cat];if(c&&c.tipo)up.tipo=c.tipo;
      S.db.doc("lancamentos/"+t.id).update(up).then(function(){done++;if(done===todo.length){autoBusy=false;reloadLanc();}}).catch(function(){done++;if(done>=todo.length){autoBusy=false;}});});
    toast(todo.length+" lançamento(s) categorizado(s) pela memória");}

  // ================= Supabase (dados + login) =================
  var sb=window.supabase.createClient(window.SB_URL,window.SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,lock:function(name,acquireTimeout,fn){return fn();}}});
  function pkOf(n){return n==="config"?"chave":"id";}
  function toRow(n,o,id){var r={};
    if(n==="contas"){var cid=(id!=null?id:(o.id!=null?o.id:null));if(cid!=null)r.id=cid;if("desc"in o)r.descricao=o.desc;["valor","dia","categoria","classe","status","mes","prov"].forEach(function(k){if(k in o)r[k]=o[k];});return r;}
    if(n==="lancamentos"){if(id!=null)r.id=id;if("desc"in o)r.descricao=o.desc;["valor","tipo","classe","categoria","status","mes","data","ts"].forEach(function(k){if(k in o)r[k]=o[k];});return r;}
    if(n==="regras"){r.id=(id!=null?id:o.id);["chave","categoria","classe","exemplo","ts"].forEach(function(k){if(k in o)r[k]=o[k];});return r;}
    if(n==="inbox"){if(id!=null)r.id=id;r.tipo=o.tipo;r.storage_path=(o.assetId||o.storage_path||null);r.nome=o.nome;r.bytes=o.bytes;r.ct=o.ct;r.status=o.status;r.ts=o.ts;return r;}
    if(n==="config"){r.chave=id;r.dados=o;return r;}
    return o;}
  function rowToObj(n,row){
    if(n==="contas")return {id:row.id,desc:row.descricao,valor:Number(row.valor),dia:row.dia,categoria:row.categoria,classe:row.classe,status:row.status,mes:row.mes,prov:row.prov};
    if(n==="lancamentos")return {id:row.id,desc:row.descricao,valor:Number(row.valor),tipo:row.tipo,classe:row.classe,categoria:row.categoria,status:row.status,mes:row.mes,data:row.data,ts:row.ts};
    if(n==="regras")return {id:row.id,chave:row.chave,categoria:row.categoria,classe:row.classe,exemplo:row.exemplo,ts:row.ts};
    if(n==="inbox")return {id:row.id,tipo:row.tipo,assetId:row.storage_path,nome:row.nome,bytes:row.bytes,ct:row.ct,status:row.status,ts:row.ts};
    return row;}
  function snapOf(n,row){var o=rowToObj(n,row);return {id:o.id,data:function(){return o;}};}
  var supaDB={
    collection:function(n){return {
      limit:function(){return this;},
      get:function(){return sb.from(n).select("*").then(function(res){if(res.error)throw res.error;return {docs:(res.data||[]).map(function(row){return snapOf(n,row);})};});},
      add:function(o){var oo=o;if(n==="contas"&&(o.id==null)){oo=Object.assign({},o,{id:(o.mes||"x")+"_add_"+Date.now()+"_"+Math.floor(Math.random()*1000)});}return sb.from(n).insert(toRow(n,oo)).then(function(r){if(r.error)throw r.error;return {};});}
    };},
    doc:function(path){var parts=path.split("/"),n=parts[0],id=parts[1];return {
      set:function(o){return sb.from(n).upsert(toRow(n,o,id)).then(function(r){if(r.error)throw r.error;return {};});},
      update:function(o){return sb.from(n).update(toRow(n,o)).eq(pkOf(n),id).then(function(r){if(r.error)throw r.error;return {};});},
      delete:function(){return sb.from(n).delete().eq(pkOf(n),id).then(function(r){if(r.error)throw r.error;return {};});}
    };}
  };
  var supaAssets={upload:function(file){
    var safe=(file.name||"extrato").replace(/[^A-Za-z0-9._-]/g,"_");
    var path=(S.mesSel||"geral")+"/"+Date.now()+"_"+safe;
    return sb.storage.from("extratos").upload(path,file,{upsert:false}).then(function(r){if(r.error)throw r.error;return {id:path,url:path,sizeBytes:file.size||0,contentType:file.type||""};});
  }};
  function reloadConfig(){return sb.from("config").select("*").then(function(res){
    (res.data||[]).forEach(function(row){var d=row.dados||{};
      if(row.chave==="saldos")S.saldos=d;else if(row.chave==="dividas")S.dividas=d;else if(row.chave==="metas")S.metas=d;
      else if(row.chave==="lucro")S.lucroCfg=d;else if(row.chave==="customcats")applyCustomCats(d.list);else if(row.chave==="tetos"){for(var k in d){if(CATMAP[k])CATMAP[k].teto=d[k];}}});
    render();}).catch(function(){});}
  function startApp(){
    S.db=supaDB;S.assetsCap=supaAssets;S.ready=true;S.loaded=true;
    reloadConfig();reloadContas();reloadLanc();reloadInbox();reloadRegras();render();
    try{document.addEventListener("click",function(e){if(e.target&&e.target.id==="logoutLink")doLogout();});}catch(e){}
    try{sb.channel("tudo")
      .on("postgres_changes",{event:"*",schema:"public",table:"contas"},function(){reloadContas();})
      .on("postgres_changes",{event:"*",schema:"public",table:"lancamentos"},function(){reloadLanc();})
      .on("postgres_changes",{event:"*",schema:"public",table:"config"},function(){reloadConfig();})
      .on("postgres_changes",{event:"*",schema:"public",table:"regras"},function(){reloadRegras();})
      .on("postgres_changes",{event:"*",schema:"public",table:"inbox"},function(){reloadInbox();})
      .subscribe();}catch(e){}
  }
  function showGate(s){var g=el("gate");if(g){g.hidden=!s;g.style.display=s?"flex":"none";}}
  function doLogin(){var em=(el("lg-email").value||"").trim(),pw=el("lg-pass").value||"",btn=el("lg-btn"),err=el("lg-err");
    if(!em||!pw){err.textContent="Preencha e-mail e senha.";return;}
    btn.disabled=true;btn.textContent="Entrando…";err.textContent="";
    var finished=false;
    var wd=setTimeout(function(){if(finished)return;
      sb.auth.getSession().then(function(r){if(finished)return;
        if(r&&r.data&&r.data.session){finished=true;showGate(false);startApp();}
        else{btn.disabled=false;btn.textContent="Entrar";err.textContent="Demorou demais. Toque em 'limpar cache' abaixo e tente de novo.";}
      }).catch(function(){if(finished)return;btn.disabled=false;btn.textContent="Entrar";err.textContent="Demorou demais. Toque em 'limpar cache' abaixo e tente de novo.";});
    },6000);
    sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(finished)return;finished=true;clearTimeout(wd);btn.disabled=false;btn.textContent="Entrar";
      if(r.error){err.textContent="E-mail ou senha incorretos.";return;}showGate(false);startApp();})
      .catch(function(){if(finished)return;finished=true;clearTimeout(wd);btn.disabled=false;btn.textContent="Entrar";err.textContent="Erro ao entrar. Tente de novo.";});}
  function doLogout(){sb.auth.signOut().then(function(){location.reload();}).catch(function(){location.reload();});}

  (function boot(){
    try{if(/[?&]reset=1/.test(location.search)){
      var fin=function(){try{var rm=[];for(var k in localStorage){if(k.indexOf("sb-")===0)rm.push(k);}rm.forEach(function(x){localStorage.removeItem(x);});}catch(e){}location.replace(location.pathname);};
      (navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}):Promise.resolve())
        .then(function(){return window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(x){return caches.delete(x);}));}):null;})
        .then(fin,fin);
      return;
    }}catch(e){}
    try{var hv=location.hash.slice(1);if(views.indexOf(hv)>=0)S.cur=hv;}catch(e){}
    go(S.cur);
    if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
    el("lg-btn").addEventListener("click",doLogin);
    el("lg-pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
    sb.auth.getSession().then(function(r){if(r.data&&r.data.session){showGate(false);startApp();}else{showGate(true);}})
      .catch(function(){showGate(true);});
  })();
})();
</script>
