<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gehlen's Club — Cobrança</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* tema compartilhado com o Financeiro (mesma chave gc_theme, padrão escuro) */
(function(){try{var t=localStorage.getItem("gc_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  /* Tema claro (padrão) — mesma paleta do Financeiro */
  :root{
    --ink:24,23,27;                 /* base dos preenchimentos neutros (vira claro no escuro) */
    --glass:rgba(255,255,255,.85);  /* vidro do painel */
    --glass2:var(--glass2); /* vidro do login */
    --bg:#f0eff2; --bg2:#eae8ef;
    --panel:var(--glass); --side:rgba(var(--ink),.015);
    --card:#ffffff; --card2:var(--card2);
    --line:#e6e4ec; --line2:#eceaf1;
    --txt:#18171b; --muted:#716f7a; --faint:#9c9aa6;
    /* vermelho da marca */
    --red:#981320; --red-2:#c41e2a; --red-ink:#981320; --red-soft:rgba(196,30,42,.10); --red-line:rgba(196,30,42,.42);
    /* status */
    --st-green:#1f9d57; --st-amber:#b9800f; --st-orange:#c8701c; --st-red:#c41e2a; --st-blue:#3b6fa0;
    --radius:16px;
    color-scheme:light;
  }
  /* Tema escuro — mesma paleta do Financeiro */
  :root[data-theme="dark"]{
    --ink:245,243,246;
    --glass:rgba(24,20,26,.82);
    --glass2:rgba(10,8,9,.96);
    --bg:#0a0809; --bg2:#18141a;
    --card:#18141a; --card2:#201b22;
    --line:#2a242d; --line2:#241f29;
    --txt:#f5f3f6; --muted:#9a949e; --faint:#6b656f;
    --red:#df2531; --red-2:#df2531; --red-ink:#f08b92; --red-soft:rgba(223,37,49,.14); --red-line:rgba(223,37,49,.40);
    --st-green:#37c47e; --st-amber:#e2b55e; --st-orange:#e39153; --st-red:#e5414c; --st-blue:#6ea0cf;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--txt);font:15px/1.5 'Figtree',-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(75% 90% at 12% 0%, rgba(139,13,26,.20), transparent 55%),
      radial-gradient(60% 70% at 100% 100%, rgba(139,13,26,.11), transparent 55%),
      var(--bg);
    min-height:100vh;padding:26px 20px 40px}

  .app{max-width:1120px;margin:0 auto;display:flex;min-height:76vh;
    background:var(--panel);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
    border:1px solid var(--line);border-radius:22px;overflow:hidden;
    box-shadow:0 1px 2px rgba(18,16,22,.05),0 18px 50px -12px rgba(18,16,22,.18)}

  .side{width:270px;flex:0 0 270px;padding:16px 12px;border-right:1px solid var(--line2);
    background:var(--side);display:flex;flex-direction:column;gap:4px}
  .dots{display:flex;gap:7px;padding:4px 8px 12px}
  .dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
  .brand{padding:0 8px 4px;display:flex;align-items:center;gap:9px;cursor:pointer}
  .brand .mark{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(145deg,var(--red-2),var(--red));display:grid;place-items:center;color:#fff;font-family:"Oswald",sans-serif;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(196,30,42,.45)}
  .brand .bz{display:flex;flex-direction:column;gap:2px;min-width:0}
  .brand img{display:none}
  .brand .tagline{color:var(--faint);font-size:10px;letter-spacing:2.2px;text-transform:uppercase;margin-top:0}
  .brand .bz b{font-family:"Oswald",sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--txt);line-height:1}
  .side-date{color:var(--muted);font-size:12px;padding:10px 8px 6px;text-transform:capitalize;border-top:1px solid var(--line2);margin-top:10px}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:4px;overflow-y:auto}
  .nav-group{margin-top:12px}
  .nav-h{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint);padding:4px 12px 6px}
  .nav-i{width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;text-align:left;transition:.14s;font-family:inherit}
  .nav-i:hover{background:rgba(var(--ink),.035);color:var(--txt)}
  .nav-i.active{background:linear-gradient(180deg,var(--red-soft),rgba(139,13,26,.05));border-color:var(--red-line);color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .nav-i .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .nav-i .nav-l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-i .badge{font-size:11px;font-weight:700;color:var(--muted);background:rgba(var(--ink),.05);border:1px solid var(--line2);border-radius:7px;padding:1px 8px;min-width:24px;text-align:center}
  .nav-i.active .badge{color:var(--txt);background:rgba(var(--ink),.09);border-color:transparent}
  .nav-i .badge.alert{background:var(--red);color:#fff;border-color:transparent;animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,13,26,.55)}50%{box-shadow:0 0 0 5px rgba(139,13,26,0)}}
  .side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:7px}
  .sbtn{width:100%;text-align:center;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s;text-decoration:none;display:block}
  .sbtn:hover{color:var(--txt);border-color:var(--red-line);background:rgba(var(--ink),.02)}

  .content{flex:1;min-width:0;padding:24px 26px 26px;display:flex;flex-direction:column}
  .upload{background:linear-gradient(180deg,var(--card),var(--card2));border:1px dashed var(--line);border-radius:18px;padding:44px 24px;text-align:center;margin:auto 0}
  .upload p{margin:0 0 18px;color:var(--muted)}
  .upload input{display:none}
  .progbar{height:9px;background:rgba(var(--ink),.06);border:1px solid var(--line2);border-radius:9999px;overflow:hidden;max-width:360px;margin:10px auto 0}
  .progfill{height:100%;width:1%;background:linear-gradient(90deg,var(--red-2),var(--red));border-radius:9999px;transition:width .3s ease}
  #topload{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;overflow:hidden;display:none}
  #topload::before{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--red-2),var(--red-2),transparent);animation:tl 1s linear infinite}
  @keyframes tl{from{left:-40%}to{left:100%}}
  .btn{background:linear-gradient(180deg,var(--red-2),var(--red));color:#F5F2ED;border:0;border-radius:9999px;padding:12px 26px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;box-shadow:0 3px 16px rgba(139,13,26,.35)}
  .btn:hover{filter:brightness(1.08)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:11px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .kpi .n{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.6px;color:var(--txt)}
  .kpi .l{color:var(--muted);font-size:11.5px;margin-top:8px}
  .kpi.acc{background:linear-gradient(180deg,var(--red-soft),var(--card));border-color:var(--red-line)}
  .kpi.acc .n{color:var(--red-ink)}
  .kpi.green .n{color:var(--st-green)} .kpi.red .n{color:var(--st-red)}

  .stage-head{display:flex;align-items:center;gap:12px;margin-bottom:3px;flex-wrap:wrap}
  .stage-head h2{font-family:"Oswald",sans-serif;font-size:22px;font-weight:600;margin:0;letter-spacing:.03em;text-transform:uppercase}
  .stage-head .badge{font-size:13px;font-weight:700;color:var(--muted);background:rgba(var(--ink),.05);border:1px solid var(--line2);border-radius:9px;padding:2px 11px}
  .hint{color:var(--muted);font-size:13px;margin:2px 0 18px;max-width:70ch}

  .row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;margin-bottom:10px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;transition:.14s}
  .row:hover{border-color:var(--red-line)}
  .row.done{opacity:.4}
  .who{min-width:0}
  .who .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .who .meta{color:var(--muted);font-size:12.5px;margin-top:5px}
  .via{color:var(--faint)}
  .tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:9999px;background:var(--card2);color:var(--muted);border:1px solid var(--line2)}
  .tag.red{background:rgba(196,30,42,.15);color:var(--st-red);border-color:transparent}
  .tag.amber{background:rgba(185,128,15,.14);color:var(--st-amber);border-color:transparent}
  .tag.soft{background:rgba(var(--ink),.05);color:var(--muted);border-color:transparent}
  .tag.dup{background:rgba(200,112,28,.15);color:var(--st-orange);border-color:transparent}
  .tag.cb{background:rgba(var(--ink),.06);color:var(--muted);border-color:transparent}
  .tag.note{background:var(--red-soft);color:var(--red-ink);border-color:transparent;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acts{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .wa{background:linear-gradient(180deg,var(--red-2),var(--red));color:#F5F2ED;border:0;border-radius:9999px;padding:9px 18px;font-weight:700;text-decoration:none;font-size:13px;transition:.15s;box-shadow:0 2px 12px rgba(139,13,26,.3)}
  .wa:hover{filter:brightness(1.08)}
  .lnk{color:var(--txt);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:9999px;padding:9px 15px;transition:.15s}
  .lnk:hover{background:rgba(var(--ink),.03);border-color:var(--red-line)}
  .dots-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9999px;min-width:40px;height:36px;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;transition:.14s;letter-spacing:1px}
  .dots-btn:hover{color:var(--txt);border-color:var(--red-line)}
  .dots-btn.has{color:var(--red-ink);border-color:var(--red-line);background:var(--red-soft)}
  .chk{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  .chk input{position:absolute;opacity:0;pointer-events:none}
  .chk .box{width:21px;height:21px;border-radius:50%;border:1.6px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.15s}
  .chk input:checked + .box{background:var(--red-soft);border-color:var(--red-2);color:var(--red-ink)}

  .note-ed{flex-basis:100%;width:100%;margin-top:13px;padding-top:13px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:9px}
  .note-ed .chips{display:flex;gap:7px;flex-wrap:wrap}
  .note-ed .chips button{background:rgba(var(--ink),.05);border:1px solid var(--line);color:var(--muted);border-radius:9999px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;transition:.14s}
  .note-ed .chips button:hover{color:var(--txt);border-color:var(--red-line)}
  .note-in{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical}
  .note-in:focus{outline:none;border-color:var(--red-line)}
  .ed-acts{display:flex;gap:9px}
  .ed-save{background:linear-gradient(180deg,var(--red-2),var(--red));color:#F5F2ED;border:0;border-radius:9999px;padding:8px 17px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
  .ed-clear{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:9999px;padding:8px 15px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .mkbtn{background:transparent;color:var(--st-green);border:1px solid rgba(31,157,87,.4);border-radius:9999px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.14s}
  .mkbtn:hover{background:rgba(31,157,87,.12)}
  .cashbtn{background:transparent;color:var(--st-amber);border:1px solid rgba(185,128,15,.42);border-radius:9999px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.14s}
  .cashbtn:hover{background:rgba(185,128,15,.12)}
  .mk-ed{flex-basis:100%;width:100%;margin-top:13px;padding-top:13px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
  .mk-ed .ln{font-size:13px;color:var(--muted)} .mk-ed .ln b{color:var(--txt);font-weight:600}
  .mk-ed .warn{color:var(--red-ink);font-size:12.5px}
  .mk-ed .ok{color:var(--st-green);font-size:13px;font-weight:700}
  .mk-save{background:linear-gradient(180deg,#1f9d57,#1f9d57);color:#0e1a13;border:0;border-radius:9999px;padding:9px 17px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
  .mk-save:disabled{opacity:.5;cursor:default}

  .empty{color:var(--faint);font-size:13.5px;padding:26px 2px;text-align:center}
  .err{background:rgba(196,30,42,.14);border:1px solid rgba(196,30,42,.3);color:var(--st-red);padding:14px 16px;border-radius:var(--radius);margin-bottom:16px;white-space:pre-wrap;font-size:13px}
  .foot{color:var(--faint);font-size:11.5px;text-align:center;margin-top:auto;padding-top:26px}

  /* Login */
  #loginOverlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(75% 90% at 50% 0%, rgba(139,13,26,.22), transparent 60%), var(--glass2);backdrop-filter:blur(6px)}
  .login-card{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 26px;display:flex;flex-direction:column;gap:13px;text-align:center;box-shadow:0 20px 60px -20px rgba(18,16,22,.25)}
  .login-logo{display:none}
  .login-sub{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
  .login-card input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px 14px;font-family:inherit;font-size:14px}
  .login-card input:focus{outline:none;border-color:var(--red-line)}
  .login-card .btn{width:100%;margin-top:4px}
  .login-err{color:var(--red-ink);font-size:13px;min-height:16px}

  @media(max-width:820px){
    body{padding:12px}
    .app{flex-direction:column;min-height:auto}
    .side{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line2);padding:14px}
    .dots{display:none}
    .side-date{display:none}
    nav{flex-direction:row;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .nav-group{margin-top:0;display:flex;gap:6px;align-items:center}
    .nav-h{display:none}
    .nav-i{width:auto;white-space:nowrap}
    .side-foot{margin-top:12px;flex-direction:row}
    .content{padding:18px 16px}
    .row{flex-direction:column;align-items:stretch}
    .acts{justify-content:flex-start}
    .tag.note{max-width:100%}
  }
</style>
</head>
<body>
<div id="topload"></div>
<div id="loginOverlay">
  <form id="loginForm" class="login-card">
    <img class="login-logo" alt="Gehlen's Club">
    <div class="login-sub">Cobrança · acesso restrito</div>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username" required>
    <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit" class="btn" id="loginBtn">Entrar</button>
    <div id="loginErr" class="login-err"></div>
  </form>
</div>
<div class="app">
  <aside class="side">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="brand">
      <div class="mark">G</div>
      <div class="bz"><b>Cobrança</b><div class="tagline">Cabelo &amp; Barba · Assinatura</div></div>
    </div>
    <div class="side-date" id="stamp"></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sidefoot" style="display:none">
      <button class="sbtn" id="reload">Recarregar</button>
      <label class="sbtn" for="file">Trocar CSV</label>
      <label class="sbtn" for="fileBase">Subir base c/ CPF</label>
      <input type="file" id="fileBase" accept=".csv,text/csv" style="display:none">
      <div id="baseStatus" style="color:var(--faint);font-size:11px;text-align:center"></div>
      <button class="sbtn" id="logout" style="margin-top:2px">Sair</button>
    </div>
  </aside>
  <main class="content">
    <div class="upload" id="uparea">
      <p>Suba o relatório de <b style="color:var(--txt)">contratos ativos</b> do Cash Barber (CSV) pra montar as cobranças do dia.</p>
      <label class="btn" for="file">Escolher arquivo CSV</label>
      <input type="file" id="file" accept=".csv,text/csv">
      <div id="fname" style="margin-top:12px;color:var(--muted);font-size:13px"></div>
      <div id="prog" style="display:none;margin-top:16px">
        <div style="color:var(--muted);font-size:13px">Carregando... <b id="progpct" style="color:var(--txt)">1%</b></div>
        <div class="progbar"><div class="progfill" id="progfill"></div></div>
      </div>
    </div>
    <div id="errbox"></div>
    <div id="content" style="display:none">
      <div class="kpis" id="kpis"></div>
      <div class="stage-head"><h2 id="stageTitle"></h2><span class="badge" id="stageCount"></span></div>
      <p class="hint" id="stageHint"></p>
      <div id="panel"></div>
    </div>
    <div class="foot">Painel privado · Cash Barber (arquivo) + Asaas (ao vivo). Nada é publicado.</div>
  </main>
</div>

<script>
const SUPABASE_URL="https://ppzeyivfymntbisprxsb.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemV5aXZmeW1udGJpc3ByeHNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjE0MDcsImV4cCI6MjEwNjc5NzQwN30.bnr2FU-oOnuXlhiKcMZGgOiP0r1Dp0UDYOhRChGWE1Y";
const FUNC=SUPABASE_URL+"/functions/v1/reconciliar";

// ===== Login compartilhado (mesmo Supabase do app de Finanças) =====
// Um login só vale pros três módulos: Finanças, Retorno e Cobrança (mesma origem, mesmo projeto Supabase).
const sb=window.supabase.createClient(SUPABASE_URL,ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
async function authToken(){ try{ const {data}=await sb.auth.getSession(); return (data&&data.session)?data.session.access_token:null; }catch(e){ return null; } }
async function fx(bodyObj){
  const token=await authToken();
  const r=await fetch(FUNC,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(token||ANON),"apikey":ANON},body:JSON.stringify(bodyObj)});
  if(r.status===401){ document.getElementById("loginOverlay").style.display="flex"; }  // sessão expirou → pede login
  return r;
}
async function checkAuth(){ const t=await authToken(); document.getElementById("loginOverlay").style.display=t?"none":"flex"; }
sb.auth.onAuthStateChange(function(_e,session){ const ov=document.getElementById("loginOverlay"); if(ov) ov.style.display=session?"none":"flex"; });
(function(){const l=document.querySelector('.brand img'),li=document.querySelector('.login-logo');if(l&&li)li.src=l.src;})();
document.getElementById("loginForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const email=document.getElementById("loginEmail").value.trim(), pass=document.getElementById("loginPass").value;
  const btn=document.getElementById("loginBtn"), err=document.getElementById("loginErr");
  btn.disabled=true; btn.textContent="Entrando..."; err.textContent="";
  try{
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(!error){ document.getElementById("loginOverlay").style.display="none"; }
    else{ err.textContent="E-mail ou senha incorretos."; }

function stashAssinantes(rows){
  try{
    const fk=(x)=>{const d=String(x||"").replace(/\D/g,"");return d.length>=10?d.slice(-10):"";};
    const em=(x)=>String(x||"").trim().toLowerCase();
    const byPhone={}, byEmail={}; let n=0;
    (rows||[]).forEach(r=>{
      const plano=String(r["Plano"]||r.plano||"").trim();
      if(!plano||/Totalizado|R\$/i.test(plano)) return;      // pula linhas de total
      const o={plano, nome:String(r["Cliente"]||r.nome||"").trim()};
      const p=fk(r["Telefone"]||r.telefone); if(p) byPhone[p]=o;
      const e=em(r["Email"]||r.email); if(e) byEmail[e]=o;
      n++;
    });
    if(n) localStorage.setItem("gc_assinantes", JSON.stringify({updated:Date.now(), count:n, byPhone, byEmail}));
  }catch(e){}
}

let progTimer=null;
let progHide=null;
function startProg(){
  if(progHide){clearTimeout(progHide);progHide=null;}
  const tl=document.getElementById("topload"); if(tl)tl.style.display="block";   // barra do topo (vale em qualquer aba)
  const p=document.getElementById("prog"),f=document.getElementById("progfill"),t=document.getElementById("progpct");
  if(!p)return; p.style.display=""; let v=1; f.style.width="1%"; t.textContent="1%";
  clearInterval(progTimer);
  progTimer=setInterval(()=>{ v+=Math.max(1,Math.round((92-v)/10)); if(v>92)v=92; f.style.width=v+"%"; t.textContent=v+"%"; },200);
}
function endProg(){
  clearInterval(progTimer);
  const tl=document.getElementById("topload");
  const p=document.getElementById("prog"),f=document.getElementById("progfill"),t=document.getElementById("progpct");
  if(f)f.style.width="100%"; if(t)t.textContent="100%";
  if(progHide)clearTimeout(progHide);
  progHide=setTimeout(()=>{ if(tl)tl.style.display="none"; if(p)p.style.display="none"; },450);
}

async function reconciliar(rows){
  showErr("");document.querySelector('label[for=file]').textContent="Carregando...";startProg();
  // anexa o CPF (da base, por e-mail/telefone) em cada linha pra casar melhor com o Asaas
  const temBase=Object.keys(BASE).length>0||Object.keys(BASE_FONE).length>0;
  const envio=temBase?rows.map(r=>{const cpf=cpfDaLinha(r);return cpf?{...r,CPF:cpf}:r;}):rows;
  try{
    const r=await fx({cashbarber:envio});
    const j=await r.json(); if(!r.ok||j.erro) throw new Error(j.erro||("HTTP "+r.status));
    DATA=j;
    await loadNotesCloud();   // puxa os lembretes da nuvem (compartilhados/atualizados)
    // mantém a aba atual; só escolhe uma na primeira carga (ou se a atual sumiu)
    if(!ACTIVE||!NAV_ORDER.includes(ACTIVE)) ACTIVE=(NAV_ORDER.find(k=>navCount(k)>0)||"todos");
    renderKpis(); renderNav(); renderMain();
    endProg();
    document.getElementById("uparea").style.display="none";
    document.getElementById("content").style.display="";
    document.getElementById("sidefoot").style.display="";
  }catch(err){endProg();showErr("Não consegui montar a lista:\n"+err.message);}
  document.querySelector('label[for=file]').textContent="Escolher arquivo CSV";
}

function baseRow(c,agg,tabKey){

  let extra="";
  if(agg&&BUCKET_LABEL[c.bucket]) extra+=`<span class="tag soft">${BUCKET_LABEL[c.bucket]}</span>`;
  if(c.duplicada) extra+=`<span class="tag dup">duplicada (${c.open_count})</span>`;
  else if(c.prox_mes) extra+=`<span class="tag">próximo mês disponível</span>`;
  if(c.no_asaas&&tabKey!=="so_cashbarber") extra+=`<span class="tag cb">só no Cash Barber</span>`;
  if(c.avulsa&&tabKey!=="cobranca_avulsa"&&tabKey!=="lembretes") extra+=`<span class="tag red">cobrança avulsa — corrigir</span>`;
  if(c.div_data&&tabKey!=="div_data") extra+=`<span class="tag amber">datas diferentes</span>`;
  if(c.cartao) extra+=`<span class="tag amber">cartão de crédito</span>`;

  let note="";

  const div=baseRow(c,agg,tab.key),acts=document.createElement("div");acts.className="acts";
  const def=agg?(BUCKET_DEF[c.bucket]||{kind:"info"}):tab;
  if(def.kind==="cobrar"){
    const wa=waLink(c.whatsapp,MSG[def.msg](c));
    if(wa)acts.innerHTML+=`<a class="wa" target="_blank" href="${wa}">WhatsApp</a>`;
    if(c.invoice_url)acts.innerHTML+=`<a class="lnk" target="_blank" href="${c.invoice_url}">Link pagamento</a>`;
  }else if(def.kind==="cartao"){
    const wa=waLink(c.whatsapp,MSG.cartao(c));
    if(wa)acts.innerHTML+=`<a class="wa" target="_blank" href="${wa}">WhatsApp</a>`;
  }else if(def.kind==="ativar"){
    if(c.ativar_onde==="asaas"){
      acts.innerHTML+=`<span class="tag amber">ativo no Cash Barber — ativar no Asaas</span>`;
    }else{
      acts.innerHTML+=`<span class="tag" style="background:rgba(31,157,87,.14);color:var(--st-green);border-color:transparent">pago ${esc(c.pago_forma||"no Asaas")} — ativar no Cash Barber</span>`;
    }
  }
  if(["so_cashbarber","boleto_esquecido","cobranca_avulsa"].includes(tab.key)||c.avulsa){
    const mk=document.createElement("button"); mk.className="mkbtn"; mk.type="button"; mk.textContent="Criar assinatura";
    mk.onclick=()=>{const ex=div.querySelector(".mk-ed"); if(ex){ex.remove();} else {div.appendChild(subEditor(c,c.avulsa?"cobranca_avulsa":tab.key));}};
    acts.appendChild(mk);
  }
  if(c.pay_id){   // tem cobrança aberta no Asaas → dá pra marcar como recebida em dinheiro (balcão)
    const rc=document.createElement("button"); rc.className="cashbtn"; rc.type="button"; rc.textContent="Recebido em dinheiro";
    rc.onclick=()=>{const ex=div.querySelector(".rc-ed"); if(ex){ex.remove();} else {div.appendChild(receberEditor(c,div));}};
    acts.appendChild(rc);
  }
  const dots=document.createElement("button");
  dots.className="dots-btn"+(NOTES[c.email]?" has":""); dots.type="button"; dots.textContent="⋯"; dots.title="Anotar resposta do cliente";
  dots.onclick=()=>{const ex=div.querySelector(".note-ed"); if(ex){ex.remove();} else {div.appendChild(noteEditor(c)); const ta=div.querySelector(".note-in"); if(ta)ta.focus();}};
  acts.appendChild(dots);
  acts.appendChild(doneChk(c)); div.appendChild(acts); return div;
}
function subEditor(c,tabKey){
  const ed=document.createElement("div"); ed.className="mk-ed";
  const b=buscaBase(c.email,c.whatsapp||c.telefone)||{};
  const cpf=b.cpf||"";
  const temEmail=!!String(c.email||"").trim();
  const base=Number(String(c.valor||"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3})/g,"").replace(",","."))||0;
  const total=(base+5).toFixed(2).replace(".",",");
  const baseFmt=base.toFixed(2).replace(".",",");
  const bloqueia=!cpf&&!temEmail;   // sem CPF e sem e-mail = impossível criar
  // A criação no Asaas é por E-MAIL: acha o cadastro pelo e-mail; se não achar, cria com o CPF.
  const cpfLinha = cpf
    ? esc(mascaraCpf(cpf))
    : (temEmail ? '<span class="warn">não encontrado na base</span>' : '<span class="warn">faltando</span>');
  const uploadBtn = `<div style="margin-top:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label class="mkbtn" for="fileBase" style="display:inline-block">Subir lista de clientes (com CPF)</label>
      <span class="ln" style="color:var(--faint)">depois de subir, clique em "Criar assinatura" de novo.</span></div>`;
  const aviso = cpf ? "" : (temEmail
    ? `<div class="warn">Sem CPF na base desse cliente. Suba a lista de clientes com CPF que eu puxo o CPF dele e crio certinho. (Sem CPF, só cria se ele já tiver cadastro no Asaas com o e-mail ${esc(c.email)}.)</div>${uploadBtn}`
    : `<div class="warn">Sem CPF e sem e-mail. Suba a lista de clientes com CPF que eu puxo os dados dele.</div>${uploadBtn}`);
  ed.innerHTML=`
    <div class="ln">Vou criar a assinatura no Asaas com:</div>
    <div class="ln"><b>${esc(c.nome)}</b> · ${esc(c.plano||"")}</div>
    <div class="ln">Valor: <b>R$ ${total}</b> (base R$ ${baseFmt} + R$5) · mensal</div>
    <div class="ln">Vencimento: <b>${esc(fmtBR(c.vencimento_cb)||"—")}</b> · Forma: Pergunte ao cliente (boleto/Pix/cartão)</div>
    <div class="ln">Desconto de R$5 se pagar até 3 dias antes · notificações do Asaas desligadas</div>
    <div class="ln">CPF: <b>${cpfLinha}</b></div>
    ${aviso}
    <div class="ed-acts">
      <button type="button" class="mk-save" ${bloqueia?"disabled":""}>Confirmar criação</button>
      <button type="button" class="ed-clear">Cancelar</button>
    </div>
    <div class="mk-result"></div>`;
  ed.querySelector(".ed-clear").onclick=()=>ed.remove();
  ed.querySelector(".mk-save").onclick=async()=>{
    const btn=ed.querySelector(".mk-save"); const out=ed.querySelector(".mk-result");
    btn.disabled=true; btn.textContent="Criando..."; out.textContent="";
    try{
      const r=await fx({criar:true,cliente:{nome:c.nome,email:c.email,cpf,telefone:c.whatsapp||b.fone||c.telefone},assinatura:{valor_base:c.valor,vencimento:c.vencimento_cb,plano:c.plano}});
      const j=await r.json();
      if(j.erro==="falta_cpf"){out.innerHTML=`<span class="warn">Esse cliente não tem cadastro no Asaas e está sem CPF na base. Preencha o CPF dele (na base ou no Cash Barber) e tente de novo.</span>`;}
      else if(!r.ok||j.erro){out.innerHTML=`<span class="warn">Erro: ${esc(j.erro||("HTTP "+r.status))}</span>`;}
      else{out.innerHTML=`<span class="ok">Assinatura criada ✓ (vence ${esc(fmtBR(j.nextDueDate))}, R$ ${String(j.valor).replace(".",",")})</span>`; const rw=ed.closest(".row"); if(rw)rw.classList.add("done"); btn.style.display="none";}
    }catch(err){out.innerHTML=`<span class="warn">Erro: ${esc(err.message)}</span>`;}
    if(ed.querySelector(".mk-save"))btn.textContent="Confirmar criação";
    btn.disabled=false;
  };
  return ed;
}
function receberEditor(c,div){
  const ed=document.createElement("div"); ed.className="mk-ed rc-ed";
  const val=temAsaas(c)?fmtMoney(c.valor_asaas):(c.valor||"");
  ed.innerHTML=`
    <div class="ln">Marcar a cobrança de <b>${esc(c.nome)}</b> como <b>recebida em dinheiro</b> no Asaas${val?` (valor ${esc(val)})`:""}, com a data de hoje. O cliente não é notificado.</div>
    <div class="ed-acts"><button type="button" class="mk-save">Confirmar</button><button type="button" class="ed-clear">Cancelar</button></div>
    <div class="mk-result"></div>`;
  ed.querySelector(".ed-clear").onclick=()=>ed.remove();
  ed.querySelector(".mk-save").onclick=async()=>{
    const btn=ed.querySelector(".mk-save"),out=ed.querySelector(".mk-result");
    btn.disabled=true;btn.textContent="Marcando...";out.textContent="";
    try{
      const r=await fx({receber:true,payment_id:c.pay_id,value:(c.valor_asaas!=null?c.valor_asaas:undefined)});
      const j=await r.json();
      if(!r.ok||j.erro){out.innerHTML=`<span class="warn">Erro: ${esc(j.erro||("HTTP "+r.status))}</span>`;}
      else{out.innerHTML=`<span class="ok">Marcado como recebido em dinheiro ✓</span>`;div.classList.add("done");btn.style.display="none";}
    }catch(err){out.innerHTML=`<span class="warn">Erro: ${esc(err.message)}</span>`;}
    if(ed.querySelector(".mk-save")){btn.textContent="Confirmar";btn.disabled=false;}
  };
  return ed;
}
</script>
<script>window.GC_MODULE="cobranca";</script>
